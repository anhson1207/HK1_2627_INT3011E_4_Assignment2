[benchmark]
name = "member3-m3.4-drsa-evaluation"
provenance = "data/benchmark_provenance.json"
raw_dir = "data/hb_table6_7/raw"
fallback_raw_dir = "data/benchmarks/raw"
output_dir = "results/member3_m3_4"

seeds = [17, 23, 42]

# Stage B: Multi-seed pilot spanning Harwell-Boeing Table 6, Table 7, and Table 8 (all READY)
stage_b_instances = [
    "bcspwr01",
    "bcspwr02",
    "bcsstk01",
    "ash85",
    "nos4",
    "bcsstk22",
    "dwt_209",
    "saylr1",
]
stage_b_timeout_seconds = 4.0

# Ablations (Operator mixture, f=b+d vs b-only, and Incremental vs Full speed)
ablation_instances = ["bcsstk01", "ash85", "nos4"]
ablation_timeout_seconds = 3.0
ablation_speed_instances = ["bcsstk01", "ash85", "dwt_209"]
ablation_speed_moves = 5000

# Stage C: Bounded expansion across all 54 verified READY instances (Tables 6, 7, 8)
stage_c_timeout_seconds = 1.5
stage_c_seed = 17
stage_c_max_batch_seconds = 360.0
